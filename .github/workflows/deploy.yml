name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          # Preview defaults: https://<owner>.github.io/<repo>/ (marked noindex).
          # At launch set repository variables SITE_URL=https://www.associazioneconvoglio.it and BASE_PATH=/
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # Sentry error monitoring (EU). A DSN is public by design; override with a repository variable if needed.
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN || 'https://4556338e98d0fcf9e0ecd00efb227789@o4512480908607488.ingest.de.sentry.io/4512493378994256' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
